name: Admin frontend unit tests
on:
  pull_request:
  push:
    branches:
      - agent/04-admin-frontend
permissions:
  contents: read
jobs:
  admin-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:admin
