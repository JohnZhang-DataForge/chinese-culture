name: Admin frontend unit and browser tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/04-admin-frontend
permissions:
  contents: read
jobs:
  admin-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:admin
  admin-browser-tests:
    runs-on: ubuntu-latest
    needs: admin-unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
