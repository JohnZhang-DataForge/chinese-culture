name: Admin backend security tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/05-admin-backend

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run admin security tests
        run: node --test tests/admin-security.test.mjs

      - name: Verify existing static site is unchanged and still builds
        run: |
          npm run build
          npm run verify
