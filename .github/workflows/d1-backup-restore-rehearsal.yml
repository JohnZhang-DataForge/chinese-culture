name: D1 native SQL backup and restore rehearsal

on:
  push:
    branches:
      - ops/d1-backup-restore-rehearsal
  workflow_dispatch:
    inputs:
      confirm_production_export:
        description: Confirm a read-only production export and import into a disposable D1 database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chinese-culture-d1-backup-restore-rehearsal
  cancel-in-progress: false

jobs:
  backup-restore:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_production_export == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check Cloudflare D1 credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Validate rehearsal script syntax
        run: node --check scripts/rehearse-d1-backup-restore.mjs

      - name: Export production D1, restore into disposable D1, verify and delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dff021f8489d2c316a14575c76de16d4
          CMS_D1_DATABASE_ID: 8b6f6c98-06fe-49eb-adbc-690d4b57c058
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node scripts/rehearse-d1-backup-restore.mjs
