name: Deploy isolated Pages preview

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "scripts/**"
      - "tests/**"
      - "astro.config.mjs"
      - "wrangler.preview.jsonc"
      - "playwright.preview.config.mjs"
      - ".github/workflows/pages-preview.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and verify static output
        run: |
          npm run build
          npm run verify

      - name: Check preview deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN; cannot deploy the isolated Pages preview."
            exit 1
          fi

      - name: Select isolated preview configuration
        run: |
          cp wrangler.preview.jsonc wrangler.jsonc
          node -e 'const c = JSON.parse(require("node:fs").readFileSync("wrangler.jsonc", "utf8")); if (c.d1_databases || c.vars || c.env) process.exit(1); console.log("Preview config has no D1 binding, production variables or named environments.")'

      - name: Deploy isolated preview without production bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=chinese-culture \
            --branch="pr-${PR_NUMBER}"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed preview browser smoke
        env:
          PREVIEW_SITE_URL: https://pr-${{ github.event.pull_request.number }}.chinese-culture-79h.pages.dev
        run: npm run test:preview
