name: Validate Astro static website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run verify
