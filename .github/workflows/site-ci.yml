name: Validate Astro static website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Validate CMS schema on an isolated local D1 database
        run: npx wrangler d1 migrations apply chinese-culture-cms --local
      - run: npm test
      - name: Validate content schema and locale translation identities
        run: npm run validate:content
      - name: Lint Admin OpenAPI contract
        run: npm run lint:openapi
      - name: Detect OpenAPI and Pages Functions contract drift
        run: npm run validate:openapi
      - run: node --check scripts/import-content-to-d1.mjs
      - run: node --check scripts/smoke-production.mjs
      - run: node --check scripts/rehearse-d1-backup-restore.mjs
      - name: Check protected CMS draft importer syntax
        run: node --check public/admin/tools/draft-import.js
      - run: node --check playwright.preview.config.mjs
      - run: npm run build
      - run: node scripts/test-cms-local.mjs
      - run: npm run verify
      - name: Package deployable static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: chinese-culture-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run Admin browser and responsive accessibility tests
        run: npm run test:browser
