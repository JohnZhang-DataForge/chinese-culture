name: QA - automated tests and browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, unit tests and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      QA_REQUIRE_BILINGUAL: ${{ vars.QA_REQUIRE_BILINGUAL || 'false' }}
      QA_REQUIRE_ADMIN: ${{ vars.QA_REQUIRE_ADMIN || 'false' }}
      QA_ENVIRONMENT: ${{ vars.QA_ENVIRONMENT || 'ci' }}
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      QA_ACCESS_JWT: ${{ secrets.QA_ACCESS_JWT }}
      QA_TEST_CONTENT_PREFIX: ${{ vars.QA_TEST_CONTENT_PREFIX || 'qa-ci' }}
      QA_ENABLE_CMS_MUTATIONS: ${{ vars.QA_ENABLE_CMS_MUTATIONS || 'false' }}
      QA_ADMIN_CONTENT_API_PATH: /api/admin/v1/content?locale=en
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run configured lint and format checks
        run: |
          npm run lint --if-present
          npm run format:check --if-present

      - name: Build static site and validate content schema
        run: npm run build

      - name: Scan built assets for leaked credentials
        run: npm run verify:secrets

      - name: Validate generated routes and Cloudflare static limits
        run: npm run verify

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload QA reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-culture-qa-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  contract-lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Lint the approved OpenAPI contract when available
        run: npm run verify:openapi

  production-smoke:
    name: Production domain, TLS and redirect smoke
    if: github.event_name != 'pull_request'
    needs: [quality, contract-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify apex HTTPS response and certificate
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 --silent --show-error --output /tmp/chinese-culture-home.html --write-out '%{http_code}' https://chinese-culture.site/)"
          test "$status" = "200"
          grep -Eqi '<title>[^<]*Chinese Culture' /tmp/chinese-culture-home.html
          echo "Apex HTTPS returned HTTP $status and passed TLS certificate validation."

      - name: Verify www permanently redirects to HTTPS apex
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 --silent --show-error --dump-header - --output /dev/null 'https://www.chinese-culture.site/__qa_redirect_probe?source=agent06')"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eqi '^HTTP/[^ ]+[[:space:]]+301'
          printf '%s\n' "$headers" | grep -Eqi '^location:[[:space:]]*https://chinese-culture.site/__qa_redirect_probe\?source=agent06'

      - name: Verify apex HTTP permanently redirects to HTTPS
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 --silent --show-error --dump-header - --output /dev/null 'http://chinese-culture.site/__qa_redirect_probe?source=agent06')"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eqi '^HTTP/[^ ]+[[:space:]]+301'
          printf '%s\n' "$headers" | grep -Eqi '^location:[[:space:]]*https://chinese-culture.site/__qa_redirect_probe\?source=agent06'
