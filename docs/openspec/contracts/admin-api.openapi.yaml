openapi: 3.1.0
info:
  title: Chinese Culture Admin API
  version: 1.2.0
  description: >
    Same-origin API for the protected D1-backed Admin CMS. D1 is the canonical editorial store; GitHub is used only for generated publication snapshots. The Cloudflare Access edge injects the Access JWT header; the browser never receives D1 or GitHub credentials.
servers:
  - url: https://chinese-culture.site/api/admin/v1
    description: Production
security:
  - CloudflareAccess: []
tags:
  - name: Session
    description: Authenticated CMS session and role information.
  - name: Content
    description: Read, create, update and translate locale-specific content variants.
  - name: Preview
    description: Render sanitized previews of unsaved Markdown.
  - name: Media
    description: Upload validated, rights-documented images to a CMS snapshot branch; store their metadata in D1.
  - name: Publishing
    description: Export exact D1 revisions to GitHub pull requests for review, publish and unpublish actions.
paths:
  /session:
    get:
      tags: [Session]
      operationId: getAdminSession
      summary: Return the verified editor identity, role and CSRF token
      responses:
        '200':
          description: Authenticated CMS session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content:
    get:
      tags: [Content]
      operationId: listContent
      summary: List locale-specific content variants and D1-backed CMS drafts
      parameters:
        - name: locale
          in: query
          required: false
          description: Filter to groups containing this locale; each returned group still includes all available locale summaries.
          schema:
            $ref: '#/components/schemas/Locale'
        - name: collection
          in: query
          schema:
            $ref: '#/components/schemas/Collection'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: q
          in: query
          description: Search title, slug and contentId.
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paged locale-specific content variants; each row identifies its shared contentId and available translations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Content]
      operationId: createContent
      summary: Create a conceptual content item and its first draft variant in D1
      security:
        - CloudflareAccess: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentWrite'
      responses:
        '201':
          description: Draft created in D1 with its first revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Content]
      operationId: getContent
      summary: Read one locale variant from D1, including its current revision and latest submission state
      responses:
        '200':
          description: Content variant
          headers:
            ETag:
              schema:
                type: string
              description: Current opaque D1 revision ETag, suitable for If-Match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Content]
      operationId: saveDraft
      summary: Create or update a draft in D1
      description: >
        This operation persists status=draft and an immutable revision snapshot in D1. It does not create a GitHub commit or write to main. If-Match is required for existing variants.
      security:
        - CloudflareAccess: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentWrite'
      responses:
        '200':
          description: Draft saved in D1
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content/{contentId}/translations:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Content]
      operationId: createTranslation
      summary: Create another locale variant linked to the same contentId
      security:
        - CloudflareAccess: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationWrite'
      responses:
        '201':
          description: Translation draft created in D1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content/{contentId}/preview:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Preview]
      operationId: previewContent
      summary: Render unsaved content as sanitized preview HTML
      security:
        - CloudflareAccess: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Sanitized preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /content/{contentId}/media:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Media]
      operationId: uploadMedia
      summary: Upload an image to the current CMS snapshot branch and store its metadata in D1
      description: >
        Maximum file size 8 MiB. Allowed image formats are JPEG, PNG, WebP and
        AVIF. SVG, HTML and other formats are rejected. The Pages Function validates
        file signatures, commits the asset to a CMS snapshot branch and stores its
        rights/accessibility metadata in D1.
      security:
        - CloudflareAccess: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/MediaUploadMetadata'
      responses:
        '201':
          description: Media committed to the CMS branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content/{contentId}/submit:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Publishing]
      operationId: submitContent
      summary: Export the selected D1 revision to a pull request for review, publish or unpublish
      description: >
        The API validates If-Match, applies the requested desired status in D1, appends a submission revision, then serializes that exact revision into a generated GitHub snapshot branch.
        intent=review keeps status=draft; intent=publish sets status=published and publishedAt;
        intent=unpublish sets status=unpublished and retains historical publishedAt. D1 remains the canonical source.
        This endpoint never merges a PR.
      security:
        - CloudflareAccess: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '200':
          description: Pull request created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /content/{contentId}/draft:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/Locale'
    delete:
      tags: [Content]
      operationId: discardDraft
      summary: Delete a D1 draft variant when no open PR depends on it
      security:
        - CloudflareAccess: []
          CsrfToken: []
      responses:
        '204':
          description: Active D1 draft variant removed; retained revision history follows the configured retention policy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /pull-requests/{number}:
    get:
      tags: [Publishing]
      operationId: getPullRequestStatus
      summary: Read PR status and required checks for a CMS submission
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Pull request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    CloudflareAccess:
      type: apiKey
      in: header
      name: CF-Access-Jwt-Assertion
      description: Injected by Cloudflare Access at the edge; the browser must not forge it.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Short-lived token returned by GET /session; required for mutations.
  parameters:
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Locale:
      name: locale
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Locale'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact opaque D1 revision ETag returned by GET or a prior mutation. The revision is monotonic and is not a Git blob SHA.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request syntax or missing required header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid Cloudflare Access identity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated identity lacks the required CMS role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Content, locale variant or PR not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Stale revision, duplicate locale or unsafe draft deletion
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailure:
      description: Schema or editorial metadata validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Media exceeds 8 MiB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMedia:
      description: Media type or file signature is not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamFailure:
      description: GitHub snapshot export or another required upstream service failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: D1 or a required runtime binding is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Locale:
      type: string
      enum: [en, zh-CN, es]
    Collection:
      type: string
      enum: [lessons, culture, festivals, books, events]
    ContentStatus:
      type: string
      enum: [draft, published, unpublished]
    Role:
      type: string
      enum: [admin, editor]
    Session:
      type: object
      required: [email, role, csrfToken, repository]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        csrfToken:
          type: string
          description: Short-lived, identity-bound mutation token.
        repository:
          type: string
          const: JohnZhang-DataForge/chinese-culture
    ContentList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentVariantSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ContentVariantSummary:
      type: object
      required: [contentId, locale, collection, slug, title, description, category, status, featured, updatedAt, revision, translationLocales]
      properties:
        contentId:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        collection:
          $ref: '#/components/schemas/Collection'
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
          description: Desired editorial state in D1; it does not by itself prove that the corresponding public snapshot is live.
        featured:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        branch:
          type: string
          description: CMS branch for the latest generated publication snapshot, if one exists.
        revision:
          type: string
          description: Monotonic D1 revision identifier; not a Git commit or blob SHA.
        pullRequest:
          type: [integer, 'null']
        translationLocales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
        tags:
          type: array
          items:
            type: string
    ContentVariant:
      allOf:
        - $ref: '#/components/schemas/ContentVariantSummary'
        - type: object
          required: [bodyMarkdown, readingMinutes]
          properties:
            bodyMarkdown:
              type: string
            seoTitle:
              type: string
              minLength: 1
              maxLength: 180
            seoDescription:
              type: string
              minLength: 1
              maxLength: 300
            publishedAt:
              type: string
              format: date-time
            order:
              type: number
              minimum: 0
            readingMinutes:
              type: integer
              minimum: 1
              default: 5
            level:
              type: string
            chinese:
              type: string
            pinyin:
              type: string
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            media:
              type: array
              items:
                $ref: '#/components/schemas/MediaMetadata'
    ContentWrite:
      type: object
      required: [locale, collection, slug, title, description, category, featured, bodyMarkdown]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        collection:
          $ref: '#/components/schemas/Collection'
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          minLength: 1
          maxLength: 500
        seoTitle:
          type: string
          minLength: 1
          maxLength: 180
        seoDescription:
          type: string
          minLength: 1
          maxLength: 300
        category:
          type: string
          minLength: 1
          maxLength: 100
        featured:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        order:
          type: number
          minimum: 0
        readingMinutes:
          type: integer
          minimum: 1
          maximum: 240
          default: 5
        level:
          type: string
          maxLength: 80
        chinese:
          type: string
          maxLength: 120
        pinyin:
          type: string
          maxLength: 120
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaMetadata'
        tags:
          type: array
          items:
            type: string
            maxLength: 80
        bodyMarkdown:
          type: string
          maxLength: 200000
    TranslationWrite:
      allOf:
        - $ref: '#/components/schemas/ContentWrite'
      description: locale must be the missing locale for the given contentId.
    PreviewRequest:
      type: object
      required: [content]
      properties:
        content:
          $ref: '#/components/schemas/ContentWrite'
    PreviewResponse:
      type: object
      required: [html, warnings]
      properties:
        html:
          type: string
          description: Sanitized HTML safe for insertion into a sandboxed preview container.
        warnings:
          type: array
          items:
            type: string
    SubmitRequest:
      type: object
      required: [intent]
      properties:
        intent:
          type: string
          enum: [review, publish, unpublish]
        summary:
          type: string
          maxLength: 500
    SubmitResult:
      type: object
      required: [contentId, locale, intent, branch, revision, pullRequest]
      properties:
        contentId:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        intent:
          type: string
          enum: [review, publish, unpublish]
        branch:
          type: string
        revision:
          type: string
          description: Exact D1 revision exported to the GitHub snapshot branch and PR.
        pullRequest:
          type: object
          required: [number, url, state]
          properties:
            number:
              type: integer
            url:
              type: string
              format: uri
            state:
              type: string
              enum: [open, closed, merged]
    PullRequestStatus:
      type: object
      required: [number, url, state, mergeable, checks]
      properties:
        number:
          type: integer
        url:
          type: string
          format: uri
        state:
          type: string
          enum: [open, closed, merged]
        mergeable:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, status, conclusion]
            properties:
              name:
                type: string
              status:
                type: string
              conclusion:
                type: string
    Source:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        publisher:
          type: string
        accessedAt:
          type: string
          format: date
    MediaUploadMetadata:
      type: object
      required: [alt, credit, license]
      properties:
        alt:
          type: string
          maxLength: 300
          description: Required unless decorative is true.
        decorative:
          type: boolean
          default: false
        credit:
          type: string
          minLength: 1
          maxLength: 300
        license:
          type: string
          minLength: 1
          maxLength: 160
        sourceUrl:
          type: string
          format: uri
    MediaMetadata:
      type: object
      required: [src, alt, credit, license]
      properties:
        src:
          type: string
          pattern: '^/media/'
        alt:
          type: string
          maxLength: 300
        decorative:
          type: boolean
          default: false
        credit:
          type: string
          maxLength: 300
        license:
          type: string
          maxLength: 160
        sourceUrl:
          type: string
          format: uri
    MediaUploadResult:
      type: object
      required: [src, publicUrl, contentType, size, blobSha, metadata]
      properties:
        src:
          type: string
        publicUrl:
          type: string
          format: uri
        contentType:
          type: string
        size:
          type: integer
        blobSha:
          type: string
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable application error code.
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
